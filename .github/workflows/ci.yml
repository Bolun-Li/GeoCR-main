name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight check dependencies
        run: python -m pip install --upgrade pip ruff pyyaml

      - name: Lint project-owned Python files
        run: ruff check train.py ultralytics/geocr tests/test_train.py

      - name: Compile project-owned Python files
        run: python -m compileall -q train.py ultralytics/geocr

      - name: Run lightweight unit tests
        run: python -m unittest discover -s tests -p test_train.py

      - name: Validate dataset YAML files
        run: python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in Path('yaml').glob('*.yaml')]"
